<svg xmlns="http://www.w3.org/2000/svg" width="1586" height="992" viewBox="0 0 1586 992">
  <defs>
    <linearGradient id="modoGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00c783"/>
      <stop offset="1" stop-color="#00a96b"/>
    </linearGradient>
  </defs>
  <g id="canvas-background"><rect width="1586" height="992" fill="#fff"/></g>

  <g id="brand-lockup" font-family="Arial, sans-serif">
    <g id="brand-mark" fill="none" stroke="url(#modoGreen)" stroke-width="13">
      <circle cx="273" cy="490" r="32" fill="url(#modoGreen)" stroke="none"/>
      <circle cx="326" cy="490" r="32"/>
    </g>
    <text id="brand-wordmark" x="393" y="515" fill="#101214" font-size="70" font-weight="700" letter-spacing="2">MODO</text>
  </g>

  <g id="phone-screen" font-family="Arial, 'Apple SD Gothic Neo', sans-serif">
    <rect id="phone-surface" x="897" y="47" width="494" height="900" rx="16" fill="#fff" stroke="#e7e8e8" stroke-width="1.5"/>
    <g id="friends-header" fill="#111315">
      <text x="925" y="130" font-size="38" font-weight="700">친구</text>
      <g id="add-friend-icon" fill="none" stroke="#17191a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="1341" cy="105" r="10"/><path d="M1325 129c1-11 8-17 16-17 5 0 9 2 12 6"/>
        <path d="M1355 105v20m-10-10h20" stroke="#00bd7d"/>
