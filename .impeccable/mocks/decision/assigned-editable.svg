    </g>

    <g id="my-profile">
      <circle cx="962" cy="218" r="38" fill="#e7f4eb"/>
      <text x="962" y="229" text-anchor="middle" fill="#176746" font-size="26" font-weight="700">J</text>
      <text x="1026" y="213" fill="#151719" font-size="23" font-weight="700">지민</text>
      <text x="1026" y="244" fill="#858b8f" font-size="18">오늘도 좋은 하루</text>
      <path d="M1348 211l8 8-8 8" fill="none" stroke="#858b8f" stroke-width="2"/>
      <path d="M925 279H1368" stroke="#e7e8e8"/>
