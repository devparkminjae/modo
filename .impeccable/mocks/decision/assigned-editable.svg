      <text x="1026" y="625" fill="#151719" font-size="23" font-weight="700">지우</text><text x="1026" y="656" fill="#858b8f" font-size="18">맛있는 거 먹고 싶다</text>
      <path d="M1348 623l8 8-8 8" fill="none" stroke="#858b8f" stroke-width="2"/>
    </g>

