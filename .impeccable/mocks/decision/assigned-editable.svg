    </g>

    <g id="friend-seoun">
      <circle cx="962" cy="400" r="38" fill="#e6f7f0"/><text x="962" y="410" text-anchor="middle" fill="#16835f" font-size="26" font-weight="700">S</text>
      <text x="1026" y="395" fill="#151719" font-size="23" font-weight="700">서윤</text><text x="1026" y="426" fill="#858b8f" font-size="18">지금 도서관에 있어요</text>
      <path d="M1348 393l8 8-8 8" fill="none" stroke="#858b8f" stroke-width="2"/><path d="M925 458H1368" stroke="#e7e8e8"/>
    </g>
    <g id="friend-minjae">
      <circle cx="962" cy="515" r="38" fill="#e8f4fc"/><text x="962" y="525" text-anchor="middle" fill="#176a91" font-size="26" font-weight="700">M</text>
      <text x="1026" y="510" fill="#151719" font-size="23" font-weight="700">민재</text><text x="1026" y="541" fill="#858b8f" font-size="18">주말에 봐요!</text>
      <path d="M1348 508l8 8-8 8" fill="none" stroke="#858b8f" stroke-width="2"/><path d="M925 573H1368" stroke="#e7e8e8"/>
    </g>
    <g id="friend-jiwoo">
